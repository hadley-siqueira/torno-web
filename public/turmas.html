<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torno CNC – Turmas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2319a7c9%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="scroll">
  <header class="topbar">
    <div class="brand"><span class="logo">⟳</span> <span data-i18n="app_title"></span> <small data-i18n="turmas"></small></div>
    <div class="user">
      <select id="langSelect" title="Idioma / Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
      <a id="linkAdmin" class="btn hidden" href="/admin.html" data-i18n="admin"></a>
      <a class="btn" href="/" data-i18n="simulator"></a>
    </div>
  </header>

  <main class="admin">
    <section class="card">
      <h2 data-i18n="join_turma"></h2>
      <form id="formJoin" class="inline-form">
        <input id="joinCode" required maxlength="20" autocomplete="off" data-i18n-placeholder="invite_code" />
        <button class="btn primary" type="submit" data-i18n="join"></button>
      </form>
      <div class="error" id="joinMsg"></div>
    </section>

    <section class="card">
      <h2 data-i18n="my_turmas_student"></h2>
      <div id="joinedList"></div>
    </section>

    <section class="card">
      <h2 data-i18n="my_turmas_teacher"></h2>
      <form id="formCreate" class="inline-form">
        <input id="newName" required maxlength="80" data-i18n-placeholder="turma_name" />
        <button class="btn primary" type="submit" data-i18n="new_turma"></button>
      </form>
      <div class="error" id="createMsg"></div>
      <div id="ownedList" class="turma-list"></div>
    </section>
  </main>

  <dialog id="dlgCode" class="card wide">
    <div class="row-between">
      <h2 id="codeTitle"></h2>
      <div class="actions">
        <button class="btn sm" id="btnCopy" data-i18n="copy"></button>
        <button class="btn" id="codeClose" data-i18n="close"></button>
      </div>
    </div>
    <p class="muted" id="codeInfo"></p>
    <textarea id="codeView" class="code-view" readonly spellcheck="false"></textarea>
  </dialog>

  <script type="module" src="/js/turmas.js"></script>
</body>
</html>
