<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torno CNC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2319a7c9%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="center-page">
  <form class="card login" id="form">
    <div class="brand big"><span class="logo">⟳</span> <span data-i18n="app_title"></span> <small data-i18n="app_subtitle"></small></div>
    <h1 data-i18n="create_account"></h1>
    <label><span data-i18n="name"></span><input id="name" autocomplete="name" required maxlength="100" autofocus /></label>
    <label><span data-i18n="username"></span><input id="username" autocomplete="username" required pattern="[a-zA-Z0-9._\-]{3,40}" /></label>
    <label><span data-i18n="email_optional"></span><input id="email" type="email" autocomplete="email" maxlength="200" /></label>
    <label><span data-i18n="new_password"></span><input id="password" type="password" autocomplete="new-password" minlength="6" required /></label>
    <label><span data-i18n="confirm_password"></span><input id="password2" type="password" autocomplete="new-password" minlength="6" required /></label>
    <div class="error" id="error" role="alert"></div>
    <button class="btn primary" type="submit" data-i18n="create_account"></button>
    <a class="center-link" id="toLogin" href="/login.html" data-i18n="have_account"></a>
    <div class="lang-switch">
      <button type="button" class="link" data-lang="pt">Português</button> ·
      <button type="button" class="link" data-lang="en">English</button>
    </div>
  </form>
  <script type="module" src="/js/signup.js"></script>
</body>
</html>
