<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TornoWeb</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2319a7c9%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⟳</span> <span data-i18n="app_title"></span> <small data-i18n="app_subtitle"></small></div>
    <div class="prog">
      <select id="programSelect"></select>
      <button id="btnOpen" class="btn" data-i18n="open"></button>
      <button id="btnNew" class="btn" data-i18n="new"></button>
      <button id="btnSave" class="btn" data-i18n="save"></button>
      <button id="btnSaveAs" class="btn" data-i18n="save_as"></button>
      <button id="btnDelete" class="btn" data-i18n="delete"></button>
      <button id="btnSubmit" class="btn" data-i18n="submit"></button>
    </div>
    <div class="user">
      <select id="langSelect" title="Idioma / Language">
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
      <a class="btn" href="/turmas.html" data-i18n="turmas"></a>
      <a id="linkAdmin" class="btn hidden" href="/admin.html" data-i18n="admin"></a>
      <details class="menu">
        <summary id="userName"></summary>
        <div class="menu-list">
          <button id="btnPassword" class="link" data-i18n="change_password"></button>
          <button id="btnLogout" class="link" data-i18n="logout"></button>
        </div>
      </details>
    </div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="panel-title">
        <span><span data-i18n="program"></span> <span id="progName" class="muted"></span></span>
        <span id="cursorPos" class="muted"></span>
      </div>
      <div class="editor">
        <div class="gutter" id="gutter"></div>
        <div class="code-wrap">
          <div class="hl" id="hl"></div>
          <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        </div>
      </div>

      <details class="settings">
        <summary data-i18n="stock"></summary>
        <div class="grid">
          <label><span data-i18n="stock_d"></span><input id="stockD" type="number" min="5" max="200" step="1" value="50" /></label>
          <label data-i18n-title="stock_di_help"><span data-i18n="stock_di"></span><input id="stockDi" type="number" min="0" max="190" step="1" value="0" /></label>
          <label><span data-i18n="stock_t"></span><input id="stockT" type="number" min="15" max="400" step="1" value="105" /></label>
          <label data-i18n-title="stock_c_help"><span data-i18n="stock_c"></span><input id="stockC" type="number" min="5" max="100" step="1" value="25" /></label>
          <label data-i18n-title="stock_f_help"><span data-i18n="stock_f"></span><input id="stockF" type="number" min="0" max="10" step="0.5" value="1" /></label>
          <button id="btnApplyStock" class="btn" data-i18n="apply"></button>
          <div class="stock-info" id="stockInfo"></div>
          <label><span data-i18n="dialect"></span>
            <select id="dialectSelect">
              <option value="sinumerik">Sinumerik (802D sl)</option>
              <option value="fanuc">Fanuc</option>
            </select>
          </label>
        </div>
      </details>

      <details class="settings">
        <summary data-i18n="turret"></summary>
        <div class="turret" id="toolList"></div>
      </details>

      <div class="messages" id="messages"></div>
    </section>

    <section class="right">
      <div class="viewport" id="viewport">
        <div class="dro">
          <div class="dro-row"><span class="ax">X</span><span id="droX" class="val">0.000</span><span class="unit">Ø mm</span></div>
          <div class="dro-row"><span class="ax">Z</span><span id="droZ" class="val">0.000</span><span class="unit">mm</span></div>
          <div class="dro-sep"></div>
          <div class="dro-small">
            <div><b>S</b> <span id="droS">0</span> rpm <span id="droDir" class="dir"></span></div>
            <div><b>F</b> <span id="droF">0</span> <span id="droFu">mm/rot</span></div>
            <div><b>T</b> <span id="droT">1</span> <span id="droTn" class="muted"></span></div>
            <div><b>G</b> <span id="droG">G0</span> · <span id="droMode"></span></div>
          </div>
        </div>
        <div class="glinfo" id="glInfo"><i></i><b id="glKind"></b> · <span id="fps">0</span> <span data-i18n="fps"></span> · <span id="glName"></span></div>
        <div class="status" id="status">
          <span id="statusState" class="pill">RESET</span>
          <span id="statusTime">0:00 / 0:00</span>
        </div>
        <div class="block" id="currentBlock"></div>
        <div class="alarm hidden" id="alarm"></div>
        <div class="views">
          <button data-view="iso" class="btn sm on" data-i18n="views_3d" data-i18n-title="views_3d_help"></button>
          <button data-view="side" class="btn sm" data-i18n="views_side" data-i18n-title="views_side_help"></button>
          <button data-view="face" class="btn sm" data-i18n="views_face" data-i18n-title="views_face_help"></button>
          <button id="btnFinished" class="btn sm" data-i18n="finished_part" data-i18n-title="finished_part_help"></button>
          <label class="chk"><input type="checkbox" id="chkPath" checked /> <span data-i18n="show_path"></span></label>
          <label class="chk"><input type="checkbox" id="chkSection" /> <span data-i18n="half_section"></span></label>
          <label class="chk" data-i18n-title="rulers_help"><input type="checkbox" id="chkRulers" checked /> <span data-i18n="rulers"></span></label>
        </div>
        <div class="legend">
          <span><i style="background:#ffa63d"></i><span data-i18n="legend_rapid"></span></span>
          <span><i style="background:#2fe0a0"></i><span data-i18n="legend_feed"></span></span>
        </div>
      </div>

      <div class="softkeys">
        <button id="btnStart" class="sk start" title="Ctrl+Enter" data-i18n="sk_start"></button>
        <button id="btnHold" class="sk" data-i18n="sk_hold"></button>
        <button id="btnReset" class="sk reset" data-i18n="sk_reset"></button>
        <button id="btnSingle" class="sk toggle" data-i18n="sk_single"></button>
        <button id="btnFinish" class="sk" data-i18n="sk_finish"></button>
        <div class="speed">
          <span data-i18n="speed"></span>
          <input id="speed" type="range" min="0" max="8" step="1" value="3" />
          <b id="speedVal">5×</b>
        </div>
      </div>
    </section>
  </main>

  <dialog id="dlgPassword" class="card">
    <form method="dialog" id="formPassword">
      <h2 data-i18n="change_password"></h2>
      <label><span data-i18n="current_password"></span><input id="pwCurrent" type="password" autocomplete="current-password" required /></label>
      <label><span data-i18n="new_password"></span><input id="pwNext" type="password" autocomplete="new-password" minlength="6" required /></label>
      <div class="error" id="pwError"></div>
      <div class="row-end">
        <button type="button" class="btn" id="pwCancel" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgSubmit" class="card">
    <form method="dialog" id="formSubmit">
      <h2 data-i18n="submit_title"></h2>
      <p id="submitProg" class="muted"></p>
      <label><span data-i18n="turmas"></span><select id="submitTurma"></select></label>
      <div class="error" id="submitError"></div>
      <div class="row-end">
        <button type="button" class="btn" id="submitCancel" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="submit"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
